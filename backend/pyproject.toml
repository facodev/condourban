    "pycparser (>=3.11,<4.0)",
    "pydantic-core (>=2.50.1,<3.0.0)",
    "pydantic-extra-types (>=2.11.1,<3.0.0)",
    "pygments (>=2.21.0,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "rich-toolkit (>=0.20.6,<0.21.0)",
    "rignore (>=0.8.1,<0.9.0)",
    "rsa (>=4.9.1,<5.0.0)",
