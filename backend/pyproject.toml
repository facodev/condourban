    "certifi (>=2026.7.22,<2027.0.0)",
    "cffi (>=2.1.1,<3.0.0)",
    "charset-normalizer (>=3.5.2,<4.0.0)",
    "click (>=8.5.0,<9.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "cryptography (>=50.0.2,<51.0.0)",
    "detect-installer (>=0.2.1,<0.3.0)",
    "dnspython (>=2.9.0,<3.0.0)",
    "ecdsa (>=0.19.2,<0.20.0)",
    "fastapi-cli (>=0.0.32,<0.0.33)",
    "fastapi-cloud-cli (>=0.26.0,<0.27.0)",
    "fastar (>=0.12.0,<0.13.0)",
    "googleapis-common-protos (>=1.75.5,<2.0.0)",
