    "h11 (>=0.16.0,<0.17.0)",
    "httpcore (>=1.0.9,<2.0.0)",
    "httptools (>=0.9.0,<0.10.0)",
    "idna (>=3.20,<4.0)",
    "iniconfig (>=2.3.1,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "mako (>=1.4.3,<2.0.0)",
    "markdown-it-py (>=4.2.0,<5.0.0)",
    "markupsafe (>=3.0.4,<4.0.0)",
    "mdurl (>=0.1.2,<0.2.0)",
    "opentelemetry-api (>=1.45.1,<2.0.0)",
    "opentelemetry-exporter-http-transport (>=0.66b1,<0.67)",
    "opentelemetry-exporter-otlp-common (>=0.66b1,<0.67)",
    "opentelemetry-exporter-otlp-proto-common (>=1.45.1,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-http (>=1.45.1,<2.0.0)",
    "opentelemetry-proto (>=1.45.1,<2.0.0)",
