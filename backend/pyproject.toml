[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "typos (>=1.51.1,<2.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)"
]


[tool.ruff]
line-length = 79
extend-exclude = ['migrations']


[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']
ignore = ['PLR2004']

[tool.ruff.format]
preview = true
quote-style = 'single'


[tool.pytest.ini_options]
pythonpath = "."
addopts = ['-p', 'no:warnings', '--cov=backend', '--cov-context=test']
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


[tool.typos.files]
extend-exclude = ["*.md", "migrations"]


[tool.fastapi]
entrypoint = "app.main:app"


[tool.poe]

[tool.poe.tasks]
lint = "ruff check . && ruff check . --diff"
format.sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
]
serve = "fastapi dev app/main.py"
test.sequence = [
    "lint",
    { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
    { cmd = "coverage html --show-contexts" },
]

[tool.poetry]
package-mode = false



