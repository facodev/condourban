@if (isOpen()) {
  <div class="dialog-backdrop" (click)="onCancel()" role="alertdialog" aria-modal="true" [attr.aria-label]="title()">
    <div class="dialog-card" (click)="$event.stopPropagation()">
      <div class="dialog-icon-glyph" [class.glyph-danger]="isDestructive()" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>

      <div class="dialog-header">
        <h3 class="text-balance">{{ title() }}</h3>
      </div>

      <div class="dialog-body">
        <p>{{ message() }}</p>
      </div>

      <div class="dialog-footer">
        <button type="button" matRipple class="btn btn-secondary focus-ring" (click)="onCancel()">
          {{ cancelText() }}
        </button>
        <button
          type="button"
          matRipple
          class="btn focus-ring"
          [class.btn-danger]="isDestructive()"
          [class.btn-primary]="!isDestructive()"
          (click)="onConfirm()"
        >
          {{ confirmText() }}
        </button>
      </div>
    </div>
  </div>
}
