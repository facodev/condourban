<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layout 1 — Grade</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root, [data-palette="a"] {
      --brand: #0F6B5C; --brand-strong: #0A4F44; --brand-soft: #D8EFEA; --accent: #E8A317;
      --surface: #F4F6F5; --card: #fff; --ink: #1A1F1E; --muted: #5C6763; --border: #D5DCD9;
    }
    [data-palette="b"] {
      --brand: #E85D04; --brand-strong: #C44D00; --brand-soft: #FFE8D6; --accent: #0F6B5C;
      --surface: #F7F5F2; --card: #fff; --ink: #1A1F1E; --muted: #6B5E54; --border: #E8DED6;
    }
    [data-palette="c"] {
      --brand: #1B4F72; --brand-strong: #0E3350; --brand-soft: #D6E4F0; --accent: #E07A5F;
      --surface: #F5F7FA; --card: #fff; --ink: #1A2332; --muted: #5A6570; --border: #CDD5DE;
    }
    [data-palette="d"] {
      --brand: #4A5D23; --brand-strong: #354418; --brand-soft: #E8EDD9; --accent: #C45C26;
      --surface: #F7F8F4; --card: #fff; --ink: #1C1F14; --muted: #5C6350; --border: #D5D9C8;
    }
    [data-palette="e"] {
      --brand: #5B3A6E; --brand-strong: #3D254C; --brand-soft: #EDE4F2; --accent: #D4A017;
      --surface: #F7F5F9; --card: #fff; --ink: #1F1824; --muted: #6B5F75; --border: #D9D0E0;
    }
    [data-palette="f"] {
      --brand: #1565C0; --brand-strong: #0D47A1; --brand-soft: #E3F0FF; --accent: #FF8F00;
      --surface: #F3F7FC; --card: #fff; --ink: #0D1B2A; --muted: #5A6A7A; --border: #C5D4E8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Source Sans 3", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, color-mix(in srgb, var(--brand) 18%, transparent), transparent),
        radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent),
        #e8ecea;
      padding: 1.25rem 1.25rem 2.5rem;
    }
    .page { max-width: 420px; margin: 0 auto; }
    a.back { color: var(--brand); font-weight: 600; text-decoration: none; font-size: .92rem; }
    .meta { margin: .55rem 0 1rem; }
    .meta h1 { font-size: 1.35rem; margin: 0 0 .35rem; letter-spacing: -.02em; }
    .meta p { margin: 0; color: var(--muted); font-size: .9rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.1rem;
    }
    .toolbar button {
      border: 1px solid var(--border); background: #fff; color: var(--muted);
      border-radius: 999px; padding: .4rem .75rem; font-size: .78rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .toolbar button.on {
      background: var(--brand); border-color: var(--brand); color: #fff;
    }
    .stage { display: flex; justify-content: center; }
    .phone {
      width: min(340px, 100%); background: var(--surface);
      border-radius: 36px; padding: 10px; position: relative;
      box-shadow:
        0 0 0 1px #1a1a1a,
        0 0 0 8px #2a2a2a,
        0 24px 50px rgb(0 0 0 / 22%);
    }
    .phone-inner {
      background: var(--surface); border-radius: 28px; overflow: hidden;
      min-height: 660px; display: flex; flex-direction: column; position: relative;
    }
    .notch {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      width: 96px; height: 22px; background: #1a1a1a; border-radius: 0 0 14px 14px; z-index: 5;
    }
    .status {
      display: flex; justify-content: space-between; padding: 14px 18px 6px;
      font-size: .7rem; font-weight: 600; color: var(--ink); background: var(--card);
    }
    .hdr {
      background: var(--card); padding: .35rem 1rem 1rem; text-align: center;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
    }
    .logo {
      width: 58px; height: 58px; margin: 0 auto .7rem; border-radius: 18px;
      background: linear-gradient(145deg, var(--brand), var(--brand-strong));
      color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .72rem;
      letter-spacing: .04em; box-shadow: 0 8px 18px color-mix(in srgb, var(--brand) 35%, transparent);
    }
    .condo {
      display: inline-flex; align-items: center; gap: .45rem;
      border: 1px solid var(--border); border-radius: 999px; padding: .5rem 1rem;
      background: var(--surface); color: var(--brand-strong); font-weight: 600; font-size: .9rem;
    }
    .condo .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }
    .greeting {
      padding: .85rem 1rem .15rem; font-size: .85rem; color: var(--muted);
    }
    .greeting strong { color: var(--ink); font-size: 1.05rem; display: block; margin-top: .1rem; }
    .grid {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: .7rem;
      padding: .65rem 1rem 5.5rem; align-content: start;
    }
    .tile {
      background: var(--card); border-radius: 18px; border: 1px solid var(--border);
      padding: 1.05rem .65rem .95rem; text-align: center;
      box-shadow: 0 4px 14px rgb(26 31 30 / 4%);
      transition: transform .15s, box-shadow .15s;
    }
    .tile:active { transform: scale(.98); }
    .ico {
      width: 46px; height: 46px; margin: 0 auto .55rem; border-radius: 14px;
      background: var(--brand-soft); display: grid; place-items: center;
    }
    .tile svg { width: 24px; height: 24px; stroke: var(--brand); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .tile span { display: block; font-size: .8rem; font-weight: 600; color: var(--ink); line-height: 1.25; }
    .nav-wrap {
      position: absolute; left: 12px; right: 12px; bottom: 14px;
    }
    .nav {
      display: flex; justify-content: space-around; align-items: center;
      padding: .45rem; background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 18px;
      box-shadow: 0 10px 30px rgb(0 0 0 / 10%);
    }
    .nav button {
      border: 0; background: transparent; color: var(--muted); padding: .55rem .7rem;
      border-radius: 12px; font-family: inherit; font-size: .72rem; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: .15rem; min-width: 64px;
    }
    .nav button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
    .nav button.on { background: var(--brand-soft); color: var(--brand-strong); }
  </style>
</head>
<body data-palette="a">
  <div class="page">
    <a class="back" href="index.html">← Hub</a>
    <div class="meta">
      <h1>Layout 1 — Grade de tiles</h1>
      <p>Toque numa paleta para pré-visualizar.</p>
    </div>
    <div class="toolbar" id="pals"></div>
    <div class="stage">
      <div class="phone">
        <div class="phone-inner">
          <div class="notch"></div>
          <div class="status"><span>9:41</span><span>5G · 86%</span></div>
          <header class="hdr">
            <div class="logo">APP</div>
            <div class="condo"><span class="dot"></span> Jardim das Palmeiras</div>
          </header>
          <div class="greeting">Olá, Ana<strong>O que você precisa hoje?</strong></div>
          <div class="grid">
            <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg></div><span>Comunicados</span></div>
            <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><span>Ocorrências</span></div>
            <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg></div><span>Documentos</span></div>
            <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg></div><span>Reservas</span></div>
            <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 7L2 7"/></svg></div><span>Correspondências</span></div>
            <div class="tile"><div class="ico"><svg viewBox="0 0 24 24"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/></svg></div><span>Convites</span></div>
          </div>
          <div class="nav-wrap">
            <nav class="nav">
              <button class="on"><svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/></svg>Home</button>
              <button><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>Avisos</button>
              <button><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Perfil</button>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const pals = [
      ['a','A Verde'],['b','B Laranja'],['c','C Ardósia'],
      ['d','D Oliva'],['e','E Roxo'],['f','F Azul']
    ];
    const bar = document.getElementById('pals');
    pals.forEach(([v,label],i) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (i===0) b.classList.add('on');
      b.onclick = () => {
        document.body.dataset.palette = v;
        [...bar.children].forEach(x => x.classList.remove('on'));
        b.classList.add('on');
      };
      bar.appendChild(b);
    });
  </script>
</body>
</html>
