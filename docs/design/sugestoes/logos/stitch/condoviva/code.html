<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo Stitch — condoviva</title>
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background: #eef2f0;
      font-family: system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
    }
    .frame {
      width: min(168px, 42vw);
      height: min(168px, 42vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 22%;
      box-shadow: 0 10px 28px rgba(15, 35, 30, 0.12);
    }
    .cap {
      color: #5C6763;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="24" fill="#2563EB"/><path d="M50 20L22 42V78C22 80.2091 23.7909 82 26 82H42V58H58V82H74C76.2091 82 78 80.2091 78 78V42L50 20Z" fill="white"/><circle cx="50" cy="42" r="7" fill="#10B981"/></svg>
  </div>
  <p class="cap">condoviva · preview 168px</p>
</body>
</html>
