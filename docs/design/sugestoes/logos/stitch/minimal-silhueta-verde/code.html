<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo Stitch — minimal-silhueta-verde</title>
  <style>
    html, body {
      margin: 0; min-height: 100%;
      background: #eef2f0;
      font-family: system-ui, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
    }
    .frame {
      width: min(168px, 42vw);
      height: min(168px, 42vw);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame svg {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 22%;
      box-shadow: 0 10px 28px rgba(15, 35, 30, 0.12);
    }
    .cap {
      color: #5C6763;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="frame">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Solid deep rich green icon background -->
  <rect width="512" height="512" rx="128" fill="#0D5C4D"/>

  <!-- Pure clean silhouette: Monolithic roofline + balanced negative space door -->
  <g transform="translate(0, 0)">
    <!-- Main pure silhouette house/tower shape -->
    <path d="M256 136L144 248H192V360C192 368.837 199.163 376 208 376H304C312.837 376 320 368.837 320 360V248H368L256 136Z" fill="white"/>
    
    <!-- Pure minimalist internal geometry (Keyhole portal / Community center) -->
    <path d="M256 264C267.046 264 276 272.954 276 284C276 292.054 271.242 298.995 264.444 302.132L268 344H244L247.556 302.132C240.758 298.995 236 292.054 236 284C236 272.954 244.954 264 256 264Z" fill="#0D5C4D"/>
    
    <!-- Accent subtle jewel dot at the ridge -->
    <circle cx="256" cy="216" r="8" fill="#34D399"/>
  </g>
</svg>
  </div>
  <p class="cap">minimal-silhueta-verde · preview 168px</p>
</body>
</html>
